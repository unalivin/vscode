# AndroidX is not optional here: every declared dependency (core-ktx, appcompat,
# activity, lifecycle-service, webkit, material) is an AndroidX artifact, so the
# build fails AarMetadata checks without this flag.
android.useAndroidX=true

# Each library gets its own R class; the app never reads a dependency's R symbols.
android.nonTransitiveRClass=true

# The Gradle daemon is disabled in CI (`--no-daemon`), so these JVM settings apply
# to the single-use build JVM. 2 GiB keeps AGP + Kotlin compilation within the
# runner's memory while leaving room for the Kotlin compiler's own heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Fail on dependency resolution problems instead of silently downgrading, and keep
# the cache off for reproducible CI runs.
org.gradle.caching=false
org.gradle.parallel=true

kotlin.code.style=official
